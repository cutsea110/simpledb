[package]
name = "simpledb"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

build = "capnp/build.rs"

[build-dependencies]
capnpc = "0.23.3"

[dependencies]
anyhow = "1.0.102"
capnp = "0.23.2"
capnp-rpc = "0.23.0"
chrono = "0.4.44"
combine = "4.6.7"
env_logger = "0.11.10"
futures = "0.3.32"
itertools = "0.13.0"
log = "0.4.29"
num-derive = "0.4.2"
num-traits = "0.2.19"
rand = "0.8.6"
structopt = "0.3.26"
tokio = {version = "1.52.1", features = ["full"]}
tokio-util = {version = "0.7.18", features = ["compat"]}

[lib]
name = "simpledb"
path = "src/lib.rs"

[[bin]]
name = "esql"
path = "app/embedded/main.rs"

[[bin]]
name = "simpledb-server"
path = "app/network/server.rs"

[[bin]]
name = "sql"
path = "app/network/client.rs"
